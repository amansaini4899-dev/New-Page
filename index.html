<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Story</title>
    <link href="https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #141414;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Profile Page Styles */
        .profile-page {
            display: flex;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            padding: 60px 40px;
            transition: opacity 0.5s ease;
        }

        .profile-page.hidden {
            display: none;
        }

        .profile-container {
            max-width: 1400px;
            width: 100%;
        }

        .profile-header h1 {
            font-size: 4rem;
            font-weight: 400;
            margin-bottom: 2rem;
            background: linear-gradient(180deg, #fff 0%, #e5e5e5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .profiles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
            margin-bottom: 60px;
        }

        .profile-card {
            cursor: pointer;
            transition: transform 0.3s ease, opacity 0.3s ease;
            text-align: center;
        }

        .profile-card:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        .profile-avatar {
            width: 200px;
            height: 200px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
            border: 3px solid transparent;
            background: linear-gradient(45deg, #e50914, #ff6b6b);
            padding: 3px;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 5px;
        }

        .profile-name {
            font-size: 1.3rem;
            color: #ffffff;
            font-weight: 400;
        }

        .manage-profiles {
            background: transparent;
            border: 1px solid #757575;
            color: #757575;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: fit-content;
        }

        .manage-profiles:hover {
            background: #757575;
            color: #ffffff;
        }

        /* Main Page Styles */
        .main-page {
            display: none;
            min-height: 100vh;
            transition: opacity 0.5s ease;
        }

        .main-page.active {
            display: block;
        }

        /* Video Background */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: url('https://images.unsplash.com/photo-1507525428034-b723a9ce6890?w=1920&h=1080&fit=crop') center/cover no-repeat;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(20, 20, 20, 0.4) 0%,
                rgba(20, 20, 20, 0.6) 40%,
                rgba(20, 20, 20, 0.9) 100%
            );
            z-index: -1;
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: linear-gradient(180deg, rgba(20,20,20,0.9) 0%, rgba(20,20,20,0.7) 50%, rgba(20,20,20,0) 100%);
            padding: 20px 40px;
            z-index: 1000;
            transition: background 0.3s ease;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(180deg, #e50914 0%, #ff6b6b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        .profile-btn img {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            border: 2px solid #ffffff;
        }

        /* Main Content */
        .main-content {
            margin-top: 0;
            padding-top: 100px;
            position: relative;
            z-index: 1;
        }

        /* Featured Section */
        .featured-section {
            padding: 100px 40px 60px;
            position: relative;
        }

        .featured-content {
            max-width: 600px;
        }

        .featured-title {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.1;
        }

        .featured-description {
            font-size: 1.5rem;
            margin-bottom: 30px;
            line-height: 1.4;
            opacity: 0.9;
        }

        .featured-buttons {
            display: flex;
            gap: 15px;
        }

        .btn-primary, .btn-secondary {
            padding: 12px 24px;
            font-size: 1.2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #ffffff;
            color: #000000;
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.75);
        }

        .btn-secondary {
            background: rgba(109, 109, 110, 0.7);
            color: #ffffff;
        }

        .btn-secondary:hover {
            background: rgba(109, 109, 110, 0.5);
        }

        /* Gallery Sections */
        .gallery-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.8rem;
            margin: 0 40px 20px;
            font-weight: 600;
        }

        .thumbnail-row {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding: 0 40px;
            scroll-behavior: smooth;
        }

        .thumbnail-row::-webkit-scrollbar {
            height: 8px;
        }

        .thumbnail-row::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        .thumbnail-row::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        .thumbnail-card {
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
            flex-shrink: 0;
            min-width: 300px;
            height: 170px;
            border-radius: 8px;
            overflow: hidden;
        }

        .thumbnail-card:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .thumbnail-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumbnail-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            padding: 20px 15px 15px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .thumbnail-card:hover .thumbnail-info {
            opacity: 1;
        }

        .thumbnail-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .thumbnail-date {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }

        .modal-content img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Floating hearts */
        .heart {
            position: fixed;
            bottom: -50px;
            font-size: 20px;
            z-index: 100;
            animation: floatUp 5s ease-in-out;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                bottom: -50px;
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                bottom: 100vh;
                opacity: 0;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .featured-title {
                font-size: 2.5rem;
            }
            
            .featured-description {
                font-size: 1.2rem;
            }
            
            .thumbnail-card {
                min-width: 200px;
                height: 120px;
            }
            
            .navbar {
                padding: 15px 20px;
            }
            
            .featured-section, .gallery-section {
                padding-left: 20px;
                padding-right: 20px;
            }
            
            .section-title {
                margin-left: 20px;
            }

            .profile-header h1 {
                font-size: 2.5rem;
            }

            .profiles-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 30px;
            }

            .profile-avatar {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <!-- Profile Page -->
    <div id="profilePage" class="profile-page">
        <div class="profile-container">
            <div class="profile-header">
                <h1>Who's watching?</h1>
            </div>
            <div class="profiles-grid">
                <div class="profile-card" onclick="goToMain()">
                    <div class="profile-avatar">
                        <img src="https://images.unsplash.com/photo-1494790108755-2616b6124e0d?w=400&h=400&fit=crop&crop=face" alt="Her Profile">
                    </div>
                    <span class="profile-name">My Love ❤️</span>
                </div>
                <div class="profile-card" onclick="goToMain()">
                    <div class="profile-avatar">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&h=400&fit=crop&crop=face" alt="Your Profile">
                    </div>
                    <span class="profile-name">Me 💝</span>
                </div>
            </div>
            <button class="manage-profiles">Manage Profiles</button>
        </div>
    </div>

    <!-- Main Page -->
    <div id="mainPage" class="main-page">
        <!-- Background Video -->
        <div class="video-background">
            <div class="video-overlay"></div>
        </div>

        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-left">
                    <h1 class="logo">Our Story ❤️</h1>
                </div>
                <div class="nav-right">
                    <button class="profile-btn" onclick="goToProfile()">
                        <img src="https://images.unsplash.com/photo-1494790108755-2616b6124e0d?w=40&h=40&fit=crop&crop=face" alt="Profile">
                    </button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Featured Section -->
            <section class="featured-section">
                <div class="featured-content">
                    <h1 class="featured-title">Our Beautiful Journey</h1>
                    <p class="featured-description">Every moment with you is a treasure that I cherish forever.</p>
                    <div class="featured-buttons">
                        <button class="btn-primary" onclick="playMemories()">▶ Play Memories</button>
                        <button class="btn-secondary" onclick="showInfo()">ℹ More Info</button>
                    </div>
                </div>
            </section>

            <!-- Gallery Sections -->
            <section class="gallery-section">
                <h2 class="section-title">Our Memories</h2>
                <div class="thumbnail-row" id="memories-row"></div>
            </section>

            <section class="gallery-section">
                <h2 class="section-title">Adventures Together</h2>
                <div class="thumbnail-row" id="adventures-row"></div>
            </section>

            <section class="gallery-section">
                <h2 class="section-title">Sweet Moments</h2>
                <div class="thumbnail-row" id="sweet-moments-row"></div>
            </section>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal" onclick="closeModal()">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script>
        // Gallery data
        const galleryData = {
            memories: [
                { type: 'photo', src: 'https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=600&h=400&fit=crop', title: 'Our First Date', date: '2023-01-15' },
                { type: 'photo', src: 'https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=600&h=400&fit=crop', title: 'Beach Sunset', date: '2023-02-14' },
                { type: 'photo', src: 'https://images.unsplash.com/photo-1519904981063-b0cf448d479e?w=600&h=400&fit=crop', title: 'Coffee Morning', date: '2023-04-10' },
                { type: 'photo', src: 'https://images.unsplash.com/photo-1513475382585-d06e58bcb0e0?w=600&h=400&fit=crop', title: 'Dinner Together', date: '2023-05-20' }
            ],
            adventures: [
                { type: 'photo', src: 'https://images.unsplash.com/photo-1559827260-dc66d52bef19?w=600&h=400&fit=crop', title: 'Mountain Hiking', date: '2023-06-15' },
                { type: 'photo', src: 'https://images.unsplash.com/photo-1476514525535-07fb3214ae8f?w=600&h=400&fit=crop', title: 'Road Trip', date: '2023-07-20' },
                { type: 'photo', src: 'https://images.unsplash.com/photo-1509316785289-025f54387624?w=600&h=400&fit=crop', title: 'City Explore', date: '2023-08-25' }
            ],
            sweetMoments: [
                { type: 'photo', src: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600&h=400&fit=crop', title: 'Cuddle Time', date: '2023-09-10' },
                { type: 'photo', src: 'https://images.unsplash.com/photo-1515372037251-f56c4a5a5c6b?w=600&h=400&fit=crop', title: 'Cooking Together', date: '2023-10-12' },
                { type: 'photo', src: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=400&fit=crop', title: 'Movie Night', date: '2023-11-15' }
            ]
        };

        // Page transitions
        function goToMain() {
            const profilePage = document.getElementById('profilePage');
            const mainPage = document.getElementById('mainPage');
            
            profilePage.style.opacity = '0';
            
            setTimeout(() => {
                profilePage.classList.add('hidden');
                mainPage.classList.add('active');
                loadThumbnails();
            }, 500);
        }

        function goToProfile() {
            const profilePage = document.getElementById('profilePage');
            const mainPage = document.getElementById('mainPage');
            
            mainPage.classList.remove('active');
            
            setTimeout(() => {
                profilePage.classList.remove('hidden');
                profilePage.style.opacity = '1';
            }, 300);
        }

        // Load thumbnails
        function loadThumbnails() {
            loadRow('memories-row', galleryData.memories);
            loadRow('adventures-row', galleryData.adventures);
            loadRow('sweet-moments-row', galleryData.sweetMoments);
        }

        function loadRow(rowId, items) {
            const row = document.getElementById(rowId);
            row.innerHTML = '';
            
            items.forEach(item => {
                const card = createThumbnailCard(item);
                row.appendChild(card);
            });
        }

        function createThumbnailCard(item) {
            const card = document.createElement('div');
            card.className = 'thumbnail-card';
            
            const img = document.createElement('img');
            img.src = item.src;
            img.alt = item.title;
            
            const info = document.createElement('div');
            info.className = 'thumbnail-info';
            info.innerHTML = `
                <div class="thumbnail-title">${item.title}</div>
                <div class="thumbnail-date">${formatDate(item.date)}</div>
            `;
            
            card.appendChild(img);
            card.appendChild(info);
            
            card.addEventListener('click', () => openFullscreen(item));
            
            return card;
        }

        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString(undefined, options);
        }

        function openFullscreen(item) {
            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modalContent');
            
            const img = document.createElement('img');
            img.src = item.src;
            img.alt = item.title;
            
            modalContent.innerHTML = '';
            modalContent.appendChild(img);
            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
        }

        function playMemories() {
            alert('▶ Playing all our beautiful memories... ❤️');
        }

        function showInfo() {
            alert('ℹ Created with love for someone special! Every moment matters.');
        }

        // Floating hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.className = 'heart';
            heart.style.left = Math.random() * window.innerWidth + 'px';
            document.body.appendChild(heart);
            
            setTimeout(() => {
                if (heart.parentNode) {
                    document.body.removeChild(heart);
                }
            }, 5000);
        }

        // Add hearts periodically
        setInterval(() => {
            if (Math.random() > 0.7) {
                createHeart();
            }
        }, 3000);
    </script>
</body>
</html>
